name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:release
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: book-smith
          path: |
            main.js
            styles.css
            manifest.json
